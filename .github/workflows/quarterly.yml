name: quarterly-refresh

on:
  schedule:
    # Every Saturday of Jan/Apr/Jul/Oct, 10:00 HKT. The gate job keeps only the first one.
    - cron: "0 2 * 1,4,7,10 6"
  workflow_dispatch:
    inputs:
      run_hsi:
        description: "Refresh the single-target runs in targets.json"
        type: boolean
        default: true
      run_stocks:
        description: "Refresh the pooled multi-stock model"
        type: boolean
        default: true
      only:
        description: "Limit run_multi.py to these target names (comma-separated); empty = all"
        type: string
        default: ""
      with_gru:
        description: "Include the pooled GRU backtest (slow)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: quarterly-refresh
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%-d)" -gt 7 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  targets:
    needs: gate
    if: needs.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.run_hsi)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data
          key: data-quarterly-targets-${{ github.run_id }}
          restore-keys: data-
      - name: Backtest and tune each target
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          ARGS="--backtest --tune --no-email"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          python run_multi.py $ARGS
      - name: Commit state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --staged --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: quarterly refresh targets $(date -u +%F) [skip ci]"
            git pull --rebase
            git push
          fi

  stocks:
    needs: gate
    if: needs.gate.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.run_stocks)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data
          key: data-quarterly-stocks-${{ github.run_id }}
          restore-keys: data-
      - name: Pooled backtests, tuning and parameters
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          WITH_GRU: ${{ inputs.with_gru }}
        run: |
          python -m src.multi.features_long
          python -m src.multi.pooled --models logit lgbm xgb
          if [ "$WITH_GRU" = "true" ]; then python -m src.multi.pooled_deep; fi
          python -m src.multi.pooled --models logit lgbm xgb --tune
          python -m src.multi.evaluate
          python -m src.multi.evaluate --tuned
          python -m src.multi.compare_tuning
          python -m src.multi.live --no-gru --tune
      - name: Commit state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --staged --quiet; then
            echo "No state changes."
          else
            git commit -m "chore: quarterly refresh stocks $(date -u +%F) [skip ci]"
            git pull --rebase
            git push
          fi

